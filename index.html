<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Замерщик: Стекло и Душевые</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --hint: #94a3b8;
      --primary: #3b82f6;
      --btn-text: #ffffff;
      --border: #334155;
      --input-bg: #0b1329;
      --input-text: #ffffff;
      --accent: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      line-height: 1.4;
      padding-bottom: 95px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .version-tag {
      font-size: 11px;
      background: #334155;
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .tab.active {
      background: var(--primary);
      color: var(--btn-text);
      border-color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .edit-banner {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      color: #fef08a;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background-color: var(--input-bg) !important;
      color: var(--input-text) !important;
      font-size: 14px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none !important;
      margin: 0 !important;
      display: none !important;
    }
    input[type=number] {
      -moz-appearance: textfield !important;
    }

    input::placeholder, textarea::placeholder {
      color: #64748b !important;
      opacity: 1;
    }

    select option {
      background-color: #0b1329;
      color: #ffffff;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .niche-grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .niche-option {
      background: #0b1329;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      min-height: 90px;
    }

    .niche-option.active {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.15);
    }

    .niche-svg {
      width: 56px;
      height: 46px;
      stroke-width: 2.5;
      fill: none;
      margin-bottom: 6px;
    }

    .niche-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .measure-box {
      background: rgba(59, 130, 246, 0.08);
      border: 1px dashed var(--primary);
      padding: 10px;
      border-radius: 8px;
      margin-top: 6px;
    }

    .footer-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .btn-submit {
      flex: 2;
      background: var(--primary);
      color: var(--btn-text);
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-pdf {
      flex: 1;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .order-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      background: #1e293b;
    }

    .order-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-action-pdf {
      background: #2563eb;
      color: #fff;
    }

    .btn-action-edit {
      background: #eab308;
      color: #000;
    }

    .btn-action-delete {
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-weight: 700; font-size: 16px;">Замерщик: Стекло & Душ</div>
    <span class="version-tag">Версия: 46</span>
  </div>

  <div class="tabs">
    <button type="button" class="tab active" id="tabNew" onclick="switchView('new')">Замер</button>
    <button type="button" class="tab" id="tabHistory" onclick="switchView('history')">База замеров</button>
  </div>

  <!-- ВКЛАДКА 1: ФОРМА ЗАМЕРА -->
  <div id="viewForm">
    <div id="editBanner" class="edit-banner">
      <span>✏️ Редактирование замера <strong id="editOrderId">#</strong></span>
      <button type="button" onclick="cancelEditing()" style="background:none; border:none; color:#fef08a; font-weight:bold; cursor:pointer;">Отмена ✕</button>
    </div>

    <form id="formEl" onsubmit="event.preventDefault();">
      <input type="hidden" id="editing_order_id" value="">

      <!-- 1. Клиент и объект -->
      <div class="card">
        <div class="card-title">👤 1. Заказчик и объект</div>
        
        <div class="grid-2">
          <div class="form-group">
            <label>ФИО Заказчика *</label>
            <input type="text" id="client_name" required placeholder="Иванов Сергей">
          </div>
          <div class="form-group">
            <label>Телефон *</label>
            <input type="tel" id="client_phone" required placeholder="+7 999 123-45-67">
          </div>
        </div>

        <div class="form-group">
          <label>Адрес объекта *</label>
          <input type="text" id="object_address" required placeholder="г. Санкт-Петербург, Невский пр., д. 20, кв. 15">
        </div>

        <div class="grid-3">
          <div class="form-group">
            <label>Парадная</label>
            <input type="text" id="entrance_info" placeholder="напр: 2">
          </div>
          <div class="form-group">
            <label>Этаж</label>
            <input type="number" id="floor_num" inputmode="numeric" placeholder="напр: 5">
          </div>
          <div class="form-group">
            <label>Лифт</label>
            <select id="has_elevator">
              <option value="Есть">Есть</option>
              <option value="Нет">Нет</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 2. Изделие и стекло -->
      <div class="card">
        <div class="card-title">📐 2. Тип изделия и стекло</div>
        <div class="grid-2">
          <div class="form-group">
            <label>Конструкция</label>
            <select id="construct_type" onchange="onConstructTypeChange()">
              <option value="Стеклянные полки" selected>Стеклянные полки</option>
              <option value="Душевая">Душевая</option>
            </select>
          </div>
          <div class="form-group">
            <label>Толщина стекла</label>
            <select id="glass_thickness">
              <option value="Согласовать" selected>Согласовать</option>
              <option value="4 мм">4 мм</option>
              <option value="6 мм">6 мм</option>
              <option value="8 мм">8 мм</option>
              <option value="10 мм">10 мм</option>
              <option value="12 мм">12 мм</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Цвет стекла</label>
            <select id="glass_color">
              <option value="Согласовать" selected>Согласовать</option>
              <option value="Бесцветное">Бесцветное</option>
              <option value="Серое">Серое</option>
              <option value="Бронза">Бронза</option>
              <option value="Кристалл">Кристалл</option>
              <option value="Черное">Черное</option>
              <option value="Рифленое">Рифленое</option>
            </select>
          </div>
          <div class="form-group">
            <label>Матирование</label>
            <select id="glass_matte">
              <option value="Согласовать" selected>Согласовать</option>
              <option value="Нет">Нет</option>
              <option value="Хим мат">Хим мат</option>
              <option value="Пескоструй">Пескоструй</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Цвет фурнитуры</label>
          <select id="hardware_color" onchange="toggleCustomHardwareColor()">
            <option value="Согласовать" selected>Согласовать</option>
            <option value="Хром">Хром</option>
            <option value="Черный">Черный</option>
            <option value="Бронза">Бронза</option>
            <option value="Золото">Золото</option>
            <option value="Другой">Другой</option>
          </select>
        </div>

        <div class="form-group" id="custom_hw_group" style="display: none;">
          <label>Укажите свой цвет фурнитуры *</label>
          <input type="text" id="custom_hw_color" placeholder="например: Белый матовый, Никель">
        </div>
      </div>

      <!-- 3А. РАЗМЕРЫ: ПОЛКИ -->
      <div class="card" id="shelf_measure_card">
        <div class="card-title">📦 3. Схема ниши (вид сверху)</div>

        <div class="niche-grid-4">
          <div class="niche-option active" id="niche_btn_1" onclick="selectNiche('Закрытая ниша', this)">
            <svg class="niche-svg" viewBox="0 0 60 50">
              <line x1="12" y1="10" x2="48" y2="10" stroke="#94a3b8" stroke-width="3.5" />
              <line x1="12" y1="10" x2="12" y2="38" stroke="#94a3b8" stroke-width="3.5" />
              <line x1="48" y1="10" x2="48" y2="38" stroke="#94a3b8" stroke-width="3.5" />
              <rect x="12" y="10" width="36" height="28" fill="rgba(59, 130, 246, 0.25)" stroke="#60a5fa" stroke-width="1.5" />
            </svg>
            <span class="niche-label">Закрытая</span>
          </div>

          <div class="niche-option" id="niche_btn_2" onclick="selectNiche('Слева короче', this)">
            <svg class="niche-svg" viewBox="0 0 60 50">
              <line x1="12" y1="10" x2="48" y2="10" stroke="#94a3b8" stroke-width="3.5" />
              <line x1="12" y1="10" x2="12" y2="24" stroke="#f87171" stroke-width="3.5" />
              <line x1="48" y1="10" x2="48" y2="44" stroke="#94a3b8" stroke-width="3.5" />
              <polygon points="12,10 48,10 48,24 12,24" fill="rgba(59, 130, 246, 0.25)" stroke="#60a5fa" stroke-width="1.5" />
              <line x1="48" y1="24" x2="48" y2="44" stroke="#60a5fa" stroke-dasharray="2,2" stroke-width="1" />
            </svg>
            <span class="niche-label">Слева короче</span>
          </div>

          <div class="niche-option" id="niche_btn_3" onclick="selectNiche('Справа короче', this)">
            <svg class="niche-svg" viewBox="0 0 60 50">
              <line x1="12" y1="10" x2="48" y2="10" stroke="#94a3b8" stroke-width="3.5" />
              <line x1="12" y1="10" x2="12" y2="44" stroke="#94a3b8" stroke-width="3.5" />
              <line x1="48" y1="10" x2="48" y2="24" stroke="#f87171" stroke-width="3.5" />
              <polygon points="12,10 48,10 48,24 12,24" fill="rgba(59, 130, 246, 0.25)" stroke="#60a5fa" stroke-width="1.5" />
              <line x1="12" y1="24" x2="12" y2="44" stroke="#60a5fa" stroke-dasharray="2,2" stroke-width="1" />
            </svg>
            <span class="niche-label">Справа короче</span>
          </div>

          <div class="niche-option" id="niche_btn_4" onclick="selectNiche('Угловая 90°', this)">
            <svg class="niche-svg" viewBox="0 0 60 50">
              <line x1="12" y1="6" x2="12" y2="44" stroke="#94a3b8" stroke-width="3.5" />
              <line x1="12" y1="44" x2="50" y2="44" stroke="#94a3b8" stroke-width="3.5" />
              <path d="M 12 16 A 28 28 0 0 1 40 44 L 12 44 Z" fill="rgba(59, 130, 246, 0.25)" stroke="#60a5fa" stroke-width="1.5" />
            </svg>
            <span class="niche-label">Угловая 90°</span>
          </div>
        </div>

        <input type="hidden" id="shelf_niche_type" value="Закрытая ниша">

        <div class="grid-2">
          <div class="form-group">
            <label>Кол-во полок (шт.) *</label>
            <input type="number" id="shelf_count" inputmode="numeric" placeholder="напр: 3">
          </div>
          <div class="form-group">
            <label>Высота ниши (мм)</label>
            <input type="number" id="shelf_h_total" inputmode="numeric" placeholder="напр: 1200">
          </div>
        </div>

        <div class="measure-box">
          <label style="color:#60a5fa;" id="shelf_width_label">Ширина ниши (мм)</label>
          <div class="grid-2" id="shelf_width_grid">
            <div id="shelf_w1_wrap">
              <label style="font-size:11px;" id="shelf_w1_sub">Ш1 (передний край)</label>
              <input type="number" id="shelf_w_front" inputmode="numeric" placeholder="Передний край">
            </div>
            <div id="shelf_w2_wrap">
              <label style="font-size:11px;" id="shelf_w2_sub">Ш2 (задняя стена)</label>
              <input type="number" id="shelf_w_back" inputmode="numeric" placeholder="Задняя стена">
            </div>
          </div>
        </div>

        <div class="measure-box" style="margin-top: 10px;">
          <label style="color:#60a5fa;" id="shelf_depth_label">Глубина ниши (мм)</label>
          <div class="grid-2" id="shelf_depth_grid">
            <div id="shelf_d1_wrap">
              <label style="font-size:11px;" id="shelf_d1_sub">Глубина слева</label>
              <input type="number" id="shelf_d_left" inputmode="numeric" placeholder="Глубина лево">
            </div>
            <div id="shelf_d2_wrap">
              <label style="font-size:11px;" id="shelf_d2_sub">Глубина справа</label>
              <input type="number" id="shelf_d_right" inputmode="numeric" placeholder="Глубина право">
            </div>
          </div>
        </div>

        <div class="grid-3" style="margin-top: 10px;">
          <div class="form-group">
            <label>Крепеж полок</label>
            <select id="shelf_holder_type">
              <option value="Согласовать" selected>Согласовать</option>
              <option value="Пеликаны">Пеликаны</option>
              <option value="Полкодержатель">Полкодержатель</option>
            </select>
          </div>
          <div class="form-group">
            <label>Кромка</label>
            <select id="shelf_edge_type">
              <option value="Согласовать" selected>Согласовать</option>
              <option value="Полировка">Полировка</option>
              <option value="Шлифовка">Шлифовка</option>
            </select>
          </div>
          <div class="form-group">
            <label>Углы полок</label>
            <select id="shelf_corners">
              <option value="Согласовать" selected>Согласовать</option>
              <option value="Прямые (90°)">Прямые (90°)</option>
              <option value="Радиус (скругление)">Радиус</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 3Б. РАЗМЕРЫ: ДУШЕВАЯ -->
      <div class="card" id="shower_measure_card" style="display: none;">
        <div class="card-title">🚿 3. Габариты проема душевой (мм)</div>

        <div class="measure-box">
          <label style="color:#60a5fa;">Высота (В1 Лево | В2 Центр | В3 Право)</label>
          <div class="grid-3">
            <input type="number" id="h_left" inputmode="numeric" placeholder="В1 Лево">
            <input type="number" id="h_center" inputmode="numeric" placeholder="В2 Центр">
            <input type="number" id="h_right" inputmode="numeric" placeholder="В3 Право">
          </div>
        </div>

        <div class="measure-box" style="margin-top: 10px;">
          <label style="color:#60a5fa;">Ширина (Ш1 Низ/Пол | Ш2 Середина | Ш3 Верх)</label>
          <div class="grid-3">
            <input type="number" id="w_bottom" inputmode="numeric" placeholder="Ш1 Низ">
            <input type="number" id="w_middle" inputmode="numeric" placeholder="Ш2 Середина">
            <input type="number" id="w_top" inputmode="numeric" placeholder="Ш3 Верх">
          </div>
        </div>

        <div class="grid-2" style="margin-top: 10px;">
          <div class="form-group">
            <label>Завал левой стены (мм)</label>
            <input type="text" id="tilt_left" placeholder="0 или +2 наружу">
          </div>
          <div class="form-group">
            <label>Завал правой стены (мм)</label>
            <input type="text" id="tilt_right" placeholder="0 или -3 внутрь">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Уклон пола / поддона</label>
            <input type="text" id="floor_slope" placeholder="напр: 4 мм к трапу">
          </div>
          <div class="form-group">
            <label>Порог / Бортик (Ш х В)</label>
            <input type="text" id="threshold_dims" placeholder="напр: 70х60 мм">
          </div>
        </div>
      </div>

      <!-- 4. Стены и примечания -->
      <div class="card">
        <div class="card-title">🧱 4. Стены и примечания</div>
        <div class="form-group">
          <label>Материал стен</label>
          <select id="wall_material">
            <option value="Керамогранит">Керамогранит</option>
            <option value="Керамическая плитка">Керамическая плитка</option>
            <option value="Гипрок">Гипрок</option>
            <option value="Бетон">Бетон</option>
          </select>
        </div>
        <div class="form-group">
          <label>Примечания</label>
          <textarea id="notes" rows="3" placeholder="Особые пожелания, вырезы, расположение розеток или крепежа..."></textarea>
        </div>
      </div>

      <div class="footer-panel">
        <button type="button" class="btn-pdf" onclick="generatePdfSheet()">📄 PDF Лист</button>
        <button type="button" class="btn-submit" id="submitBtn" onclick="submitToBot()">✅ Внести замер</button>
      </div>

    </form>
  </div>

  <!-- ВКЛАДКА 2: ИСТОРИЯ И ПОИСК -->
  <div id="viewHistory" style="display: none;">
    <div class="card">
      <div class="card-title" style="justify-content: space-between;">
        <span>🔍 Поиск и управление заказами</span>
        <button type="button" onclick="loadAndRenderServerOrders()" style="background:#334155; border:none; color:#60a5fa; padding:4px 8px; border-radius:6px; cursor:pointer; font-size:11px;">🔄 Обновить</button>
      </div>
      <div class="form-group">
        <input type="text" id="searchInput" oninput="doSearch()" placeholder="Поиск по клиенту, адресу или телефону...">
      </div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const SERVER_API_URL = 'https://hwsverhbot.ru:8443/glass-api/api/orders';
    const LOCAL_KEY = 'glass_orders_db_v46';

    // Определение текущего пользователя Telegram
    const currentUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 0;
    // Главный супер-администратор
    const SUPER_ADMIN_ID = 253051175;

    let currentOrders = [];

    function loadLocal() {
      try {
        return JSON.parse(localStorage.getItem(LOCAL_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveLocal(list) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
      currentOrders = list;
    }

    // Запрос базы данных с сервера с передачей user_id
    async function fetchServerOrders() {
      try {
        const res = await fetch(`${SERVER_API_URL}?user_id=${currentUserId}`, {
          method: 'GET',
          cache: 'no-store'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            saveLocal(data);
            return data;
          }
        }
      } catch (e) {
        console.warn("Fetch error:", e);
      }
      return loadLocal();
    }

    async function loadAndRenderServerOrders() {
      const target = document.getElementById('historyList');
      target.innerHTML = '<p style="color:var(--hint); text-align:center; padding: 20px;">Загрузка данных...</p>';
      const orders = await fetchServerOrders();
      renderList(orders);
    }

    // Скачивание PDF напрямую с сервера
    function downloadItemPdfById(orderId) {
      const url = `https://hwsverhbot.ru:8443/glass-api/api/orders/${orderId}/pdf`;
      if (tg && typeof tg.openLink === 'function') {
        tg.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    function editOrder(orderId) {
      const item = currentOrders.find(o => o.id === orderId) || loadLocal().find(o => o.id === orderId);
      if (!item) return;

      document.getElementById('editing_order_id').value = item.id;
      document.getElementById('editOrderId').innerText = '#' + item.id;
      document.getElementById('editBanner').style.display = 'flex';
      document.getElementById('submitBtn').innerText = '💾 Сохранить изменения';

      document.getElementById('client_name').value = item.client_name || '';
      document.getElementById('client_phone').value = item.client_phone || '';
      document.getElementById('object_address').value = item.object_address || '';
      document.getElementById('entrance_info').value = item.entrance_info && item.entrance_info !== '-' ? item.entrance_info : '';
      document.getElementById('floor_num').value = item.floor_num && item.floor_num !== '-' ? item.floor_num : '';
      document.getElementById('has_elevator').value = item.has_elevator || 'Есть';

      document.getElementById('construct_type').value = item.construct_type || 'Стеклянные полки';
      onConstructTypeChange();

      document.getElementById('glass_thickness').value = item.glass_thickness || 'Согласовать';
      document.getElementById('wall_material').value = item.wall_material || 'Керамогранит';
      document.getElementById('notes').value = item.notes && item.notes !== '-' ? item.notes : '';

      if (item.construct_type === 'Стеклянные полки') {
        const nicheType = item.shelf_niche_type || 'Закрытая ниша';
        let btn = document.getElementById('niche_btn_1');
        if (nicheType.includes('Слева короче')) btn = document.getElementById('niche_btn_2');
        else if (nicheType.includes('Справа короче')) btn = document.getElementById('niche_btn_3');
        else if (nicheType.includes('Угловая')) btn = document.getElementById('niche_btn_4');
        selectNiche(nicheType, btn);

        document.getElementById('shelf_count').value = item.shelf_count || '3';
        document.getElementById('shelf_h_total').value = item.shelf_h_total && item.shelf_h_total !== '-' ? item.shelf_h_total : '';
        document.getElementById('shelf_w_front').value = item.shelf_w_front || '';
        document.getElementById('shelf_w_back').value = item.shelf_w_back && item.shelf_w_back !== '-' ? item.shelf_w_back : '';
        document.getElementById('shelf_d_left').value = item.shelf_d_left || '';
        document.getElementById('shelf_d_right').value = item.shelf_d_right && item.shelf_d_right !== '-' ? item.shelf_d_right : '';

        document.getElementById('shelf_holder_type').value = item.shelf_holder_type || 'Согласовать';
        document.getElementById('shelf_edge_type').value = item.shelf_edge_type || 'Согласовать';
        document.getElementById('shelf_corners').value = item.shelf_corners || 'Согласовать';
      } else {
        document.getElementById('h_left').value = item.h_left || '';
        document.getElementById('h_center').value = item.h_center || '';
        document.getElementById('h_right').value = item.h_right || '';
        document.getElementById('w_bottom').value = item.w_bottom || '';
        document.getElementById('w_middle').value = item.w_middle || '';
        document.getElementById('w_top').value = item.w_top || '';
        document.getElementById('tilt_left').value = item.tilt_left || '';
        document.getElementById('tilt_right').value = item.tilt_right || '';
        document.getElementById('floor_slope').value = item.floor_slope || '';
        document.getElementById('threshold_dims').value = item.threshold_dims || '';
      }

      switchView('new');
    }

    function cancelEditing() {
      document.getElementById('editing_order_id').value = '';
      document.getElementById('editBanner').style.display = 'none';
      document.getElementById('submitBtn').innerText = '✅ Внести замер';
      document.getElementById('formEl').reset();
      onConstructTypeChange();
    }

    function switchView(tab) {
      document.getElementById('tabNew').classList.toggle('active', tab === 'new');
      document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
      document.getElementById('viewForm').style.display = tab === 'new' ? 'block' : 'none';
      document.getElementById('viewHistory').style.display = tab === 'history' ? 'block' : 'none';

      const footer = document.querySelector('.footer-panel');
      if (footer) footer.style.display = tab === 'new' ? 'flex' : 'none';

      if (tab === 'history') {
        loadAndRenderServerOrders();
      }
    }

    function onConstructTypeChange() {
      const type = document.getElementById('construct_type').value;
      const isShelf = (type === 'Стеклянные полки');
      document.getElementById('shower_measure_card').style.display = isShelf ? 'none' : 'block';
      document.getElementById('shelf_measure_card').style.display = isShelf ? 'block' : 'none';
    }

    function selectNiche(nicheValue, element) {
      document.querySelectorAll('.niche-option').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      document.getElementById('shelf_niche_type').value = nicheValue;

      const wLabel = document.getElementById('shelf_width_label');
      const wGrid = document.getElementById('shelf_width_grid');
      const w1Sub = document.getElementById('shelf_w1_sub');
      const w1Input = document.getElementById('shelf_w_front');
      const w2Wrap = document.getElementById('shelf_w2_wrap');

      const dLabel = document.getElementById('shelf_depth_label');
      const dGrid = document.getElementById('shelf_depth_grid');
      const d1Sub = document.getElementById('shelf_d1_sub');
      const d1Input = document.getElementById('shelf_d_left');
      const d2Wrap = document.getElementById('shelf_d2_wrap');

      if (nicheValue.includes('Угловая')) {
        wLabel.innerText = 'Ширина полки (мм)';
        w1Sub.innerText = 'Размер по стене 1 (мм)';
        w1Input.placeholder = 'напр: 300';
        w2Wrap.style.display = 'none';
        wGrid.style.gridTemplateColumns = '1fr';

        dLabel.innerText = 'Глубина полки (мм)';
        d1Sub.innerText = 'Размер по стене 2 (мм)';
        d1Input.placeholder = 'напр: 300';
        d2Wrap.style.display = 'none';
        dGrid.style.gridTemplateColumns = '1fr';
      } else {
        w2Wrap.style.display = 'block';
        wGrid.style.gridTemplateColumns = '1fr 1fr';
        d2Wrap.style.display = 'block';
        dGrid.style.gridTemplateColumns = '1fr 1fr';

        wLabel.innerText = 'Ширина ниши (мм)';
        w1Sub.innerText = 'Ш1 (передний край)';
        w1Input.placeholder = 'Передний край';
        document.getElementById('shelf_w2_sub').innerText = 'Ш2 (задняя стена)';

        dLabel.innerText = 'Глубина стен (мм)';
        if (nicheValue.includes('Слева короче')) {
          d1Sub.innerText = 'Слева (короткая ⚠️)';
          document.getElementById('shelf_d2_sub').innerText = 'Справа (длинная)';
        } else if (nicheValue.includes('Справа короче')) {
          d1Sub.innerText = 'Слева (длинная)';
          document.getElementById('shelf_d2_sub').innerText = 'Справа (короткая ⚠️)';
        } else {
          d1Sub.innerText = 'Глубина слева';
          document.getElementById('shelf_d2_sub').innerText = 'Глубина справа';
        }
        d1Input.placeholder = 'Глубина лево';
      }
    }

    function toggleCustomHardwareColor() {
      const hwSelect = document.getElementById('hardware_color').value;
      const customGroup = document.getElementById('custom_hw_group');
      if (hwSelect === 'Другой') {
        customGroup.style.display = 'block';
      } else {
        customGroup.style.display = 'none';
        document.getElementById('custom_hw_color').value = '';
      }
    }

    function getFormData() {
      const editingId = document.getElementById('editing_order_id').value;
      const construct = document.getElementById('construct_type').value;
      const colorVal = document.getElementById('glass_color').value;
      const matteVal = document.getElementById('glass_matte').value;
      
      let fullGlass = colorVal;
      if (colorVal === 'Согласовать' && matteVal === 'Согласовать') {
        fullGlass = 'Согласовать';
      } else if (matteVal === 'Согласовать') {
        fullGlass = `${colorVal}, Матирование: Согласовать`;
      } else if (matteVal !== 'Нет') {
        fullGlass = `${colorVal}, ${matteVal}`;
      }

      let hwColor = document.getElementById('hardware_color').value;
      if (hwColor === 'Другой') {
        const customVal = document.getElementById('custom_hw_color').value.trim();
        hwColor = customVal ? customVal : 'Другой';
      }

      const entrance = document.getElementById('entrance_info').value.trim();
      const floor = document.getElementById('floor_num').value.trim();
      const elevator = document.getElementById('has_elevator').value;
      
      let floorInfoArr = [];
      if (entrance) floorInfoArr.push(`Парадная: ${entrance}`);
      if (floor) floorInfoArr.push(`Этаж: ${floor}`);
      floorInfoArr.push(`Лифт: ${elevator}`);
      const combinedFloorInfo = floorInfoArr.join(', ');

      const base = {
        id: editingId || Date.now().toString().slice(-6),
        date: new Date().toLocaleDateString('ru-RU'),
        client_name: document.getElementById('client_name').value.trim(),
        client_phone: document.getElementById('client_phone').value.trim(),
        object_address: document.getElementById('object_address').value.trim(),
        entrance_info: entrance || '-',
        floor_num: floor || '-',
        has_elevator: elevator,
        floor_info: combinedFloorInfo,
        construct_type: construct,
        glass_thickness: document.getElementById('glass_thickness').value,
        glass_color: fullGlass,
        hardware_color: hwColor,
        wall_material: document.getElementById('wall_material').value,
        notes: document.getElementById('notes').value.trim() || '-'
      };

      if (construct === 'Стеклянные полки') {
        const isCorner = document.getElementById('shelf_niche_type').value.includes('Угловая');
        const wFront = document.getElementById('shelf_w_front').value.trim() || '0';
        const dLeft = document.getElementById('shelf_d_left').value.trim() || '0';

        return {
          ...base,
          shelf_niche_type: document.getElementById('shelf_niche_type').value,
          shelf_count: document.getElementById('shelf_count').value.trim() || '1',
          shelf_h_total: document.getElementById('shelf_h_total').value.trim() || '-',
          shelf_w_front: wFront,
          shelf_w_back: isCorner ? '-' : (document.getElementById('shelf_w_back').value.trim() || '0'),
          shelf_d_left: dLeft,
          shelf_d_right: isCorner ? '-' : (document.getElementById('shelf_d_right').value.trim() || '0'),
          shelf_holder_type: document.getElementById('shelf_holder_type').value,
          shelf_edge_type: document.getElementById('shelf_edge_type').value,
          shelf_corners: document.getElementById('shelf_corners').value
        };
      } else {
        return {
          ...base,
          h_left: document.getElementById('h_left').value.trim() || '0',
          h_center: document.getElementById('h_center').value.trim() || '0',
          h_right: document.getElementById('h_right').value.trim() || '0',
          w_bottom: document.getElementById('w_bottom').value.trim() || '0',
          w_middle: document.getElementById('w_middle').value.trim() || '0',
          w_top: document.getElementById('w_top').value.trim() || '0',
          tilt_left: document.getElementById('tilt_left').value.trim() || '0 (в норме)',
          tilt_right: document.getElementById('tilt_right').value.trim() || '0 (в норме)',
          floor_slope: document.getElementById('floor_slope').value.trim() || 'Без уклона',
          threshold_dims: document.getElementById('threshold_dims').value.trim() || 'Без порога'
        };
      }
    }

    function validate(data) {
      if (!data.client_name || !data.client_phone || !data.object_address) {
        alert('Заполните: Имя, Телефон и Адрес');
        return false;
      }
      if (data.construct_type === 'Стеклянные полки') {
        if (!data.shelf_w_front || !data.shelf_d_left) {
          alert('Укажите ширину и глубину полки / ниши в мм');
          return false;
        }
      } else {
        if (!data.h_left || !data.w_bottom) {
          alert('Укажите габариты проема душевой (высота и ширина в мм)');
          return false;
        }
      }
      if (document.getElementById('hardware_color').value === 'Другой' && !document.getElementById('custom_hw_color').value.trim()) {
        alert('Укажите название цвета фурнитуры');
        return false;
      }
      return true;
    }

    function submitToBot() {
      const d = getFormData();
      if (!validate(d)) return;

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(d));
      } else {
        alert(`✅ Замер #${d.id} отправлен!`);
        cancelEditing();
        switchView('history');
      }
    }

    async function generatePdfSheet() {
      const d = getFormData();
      if (!validate(d)) return;
      
      try {
        await fetch(SERVER_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(d)
        });
      } catch (e) {}

      downloadItemPdfById(d.id);
    }

    function deleteOrder(orderId) {
      if (!confirm(`Вы действительно хотите удалить замер #${orderId}? Действие необратимо.`)) {
        return;
      }
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify({ action: 'delete', order_id: orderId }));
      }
    }

    function renderList(list) {
      const target = document.getElementById('historyList');

      if (!list || !list.length) {
        target.innerHTML = '<p style="color:var(--hint); text-align:center; padding: 25px;">Замеров пока нет</p>';
        return;
      }

      // Проверка: является ли пользователь супер-админом
      const isAdmin = (currentUserId === SUPER_ADMIN_ID);

      target.innerHTML = list.map(item => {
        const isShelf = (item.construct_type === 'Стеклянные полки');
        const isCorner = isShelf && item.shelf_niche_type && item.shelf_niche_type.includes('Угловая');
        const sizeInfo = isShelf
          ? (isCorner 
              ? `Схема: ${item.shelf_niche_type} | Полок: ${item.shelf_count || 1} шт. | ${item.shelf_w_front} x ${item.shelf_d_left} мм`
              : `Схема: ${item.shelf_niche_type || 'Полки'} | Полок: ${item.shelf_count || 1} шт. | Ш: ${item.shelf_w_front} мм x Г: ${item.shelf_d_left} мм`)
          : `В: ${item.h_left}/${item.h_center}/${item.h_right} мм | Ш: ${item.w_bottom}/${item.w_middle}/${item.w_top} мм`;

        const deleteButtonHtml = isAdmin 
          ? `<button type="button" class="btn-action btn-action-delete" onclick="deleteOrder('${item.id}')">🗑 Удалить</button>` 
          : '';

        return `
          <div class="order-item">
            <div style="display:flex; justify-content:space-between; font-weight:700;">
              <span>#${item.id} — ${item.client_name}</span>
              <span style="font-size:12px; color:var(--hint);">${item.date}</span>
            </div>
            <div style="font-size:12px; color:#94a3b8; margin: 2px 0;">📍 ${item.object_address}</div>
            <div style="font-size:11px; color:#64748b; margin-bottom: 2px;">🏢 ${item.floor_info || '-'}</div>
            <div style="font-size:12px; color:#60a5fa; font-weight:600;">
              ${item.construct_type} (${item.glass_thickness}, ${item.glass_color}) | Фурнитура: ${item.hardware_color}
            </div>
            <div style="font-size:11px; color:#cbd5e1; margin-top:2px;">
              ${sizeInfo}
            </div>
            
            <div class="order-actions">
              <button type="button" class="btn-action btn-action-pdf" onclick="downloadItemPdfById('${item.id}')">📄 PDF</button>
              <button type="button" class="btn-action btn-action-edit" onclick="editOrder('${item.id}')">✏️ Изменить</button>
              ${deleteButtonHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    function doSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = currentOrders.filter(o => 
        (o.client_name && o.client_name.toLowerCase().includes(q)) ||
        (o.object_address && o.object_address.toLowerCase().includes(q)) ||
        (o.client_phone && o.client_phone.toLowerCase().includes(q)) ||
        (o.id && o.id.includes(q))
      );
      renderList(filtered);
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchServerOrders();
    });
  </script>
</body>
</html>
